<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제5병기창 · 웹 플레이</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10191d;color:#eef1ed}*{box-sizing:border-box}body{margin:0}header,footer{max-width:1400px;margin:auto;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header strong{font-size:20px;letter-spacing:.06em}header span{color:#a8b6bb;font-size:13px}nav{margin-left:auto;display:flex;gap:10px}button,a{font:inherit;color:inherit}button{border:1px solid #56656c;background:#27343a;border-radius:6px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ffaf68;outline-offset:3px}.primary{background:#ff8b36;color:#192126;border:0;font-weight:700;padding:15px 30px}.stage{position:relative;max-width:1400px;margin:auto;background:#080d10;aspect-ratio:16/9;overflow:hidden}.stage:fullscreen{max-width:none;width:100vw;height:100vh;display:grid;place-items:center}.stage:fullscreen canvas{width:100%;height:100%;object-fit:contain}canvas{display:block;width:100%;height:100%;outline:none}.overlay{position:absolute;inset:0;background:radial-gradient(ellipse at 65% 30%,#263b40,#10191d 70%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}.overlay[hidden]{display:none}h1{font-size:clamp(24px,4vw,48px);margin:0 0 12px}p{color:#afbdc1;line-height:1.7;max-width:560px}progress{width:min(360px,80vw);height:10px;accent-color:#ff8b36;margin:18px}footer{font-size:13px;color:#aebbc0;line-height:1.8}footer a{margin-left:auto}.warning{color:#ffc291}#status{white-space:pre-line}#mobile{display:none}@media(pointer:coarse){#mobile{display:block}}@media(max-width:650px){header{padding:12px}nav{margin-left:0}footer{padding:12px}.stage{min-height:360px}}
</style></head><body>
<header><strong>제5병기창</strong><span>전술 포격전 · PC 웹 프리뷰</span><nav><button id="pause" disabled>일시정지</button><button id="fullscreen" disabled>전체화면</button></nav></header>
<main class="stage" id="stage"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="제5병기창 게임 화면"></canvas>
<section class="overlay" id="overlay"><h1 id="title">한 발로 전장을 바꾸세요.</h1><p id="status" role="status" aria-live="polite">지형을 무너뜨리고, 엄폐하며, 상대 전차를 제압하세요.
AI 대전과 같은 PC에서 즐기는 2인 대전을 지원합니다.</p><p id="mobile" class="warning">키보드와 마우스가 있는 PC에서 플레이해 주세요.</p><progress id="progress" max="1" value="0" hidden></progress><button id="start" class="primary">플레이 시작</button></section></main>
<footer><span>방향키 이동 · W/S 각도 · A/D 방향 · Q/E 위력 · SPACE 발사<br>우클릭 드래그 회전 · 휠 줌 · ESC 또는 화면 메뉴로 정지<br>전체화면에서 ESC는 전체화면을 해제하며 대전을 정지합니다. 소리는 게임 화면을 클릭하면 활성화됩니다.</span><a href="Licenses/" target="_blank" rel="noopener">사용 에셋 · 라이선스</a></footer>
<script>
'use strict';
const canvas=document.getElementById('unity-canvas'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),status=document.getElementById('status'),progress=document.getElementById('progress'),title=document.getElementById('title'),fullscreen=document.getElementById('fullscreen'),pause=document.getElementById('pause');
let instance=null,started=false,loading=false,quitting=false;
function pauseGame(){if(instance&&!quitting)instance.SendMessage('Web session','PauseForBrowser');}
function fail(message){loading=false;overlay.hidden=false;progress.hidden=true;title.textContent='게임을 불러오지 못했습니다.';status.textContent='새로고침 후 다시 시도해 주세요. 문제가 계속되면 PC의 최신 Chrome 또는 Edge를 이용해 주세요.';start.textContent='새로고침';start.hidden=false;start.onclick=()=>location.reload();console.error(message);}
function ended(){quitting=true;instance=null;overlay.hidden=false;progress.hidden=true;title.textContent='플레이해 주셔서 감사합니다.';status.textContent='게임이 종료되었습니다. 다시 시작하면 새 대전을 즐길 수 있습니다.';start.textContent='다시 시작';start.hidden=false;start.onclick=()=>location.reload();fullscreen.disabled=pause.disabled=true;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},devicePixelRatio:1,onQuit:ended,showBanner:(message,type)=>{if(type==='error')fail(message);else console.warn(message);}};
start.onclick=()=>{if(started)return;started=true;loading=true;start.hidden=true;progress.hidden=false;title.textContent='전장을 준비하고 있습니다.';status.textContent='처음 실행할 때 게임 데이터를 내려받습니다. 잠시 기다려 주세요.';canvas.focus();const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=()=>fail('Game loader unavailable');script.onload=()=>createUnityInstance(canvas,config,value=>{progress.value=value;status.textContent='게임 불러오는 중 '+Math.round(value*100)+'%';}).then(game=>{instance=game;loading=false;overlay.hidden=true;fullscreen.disabled=pause.disabled=false;canvas.focus();if(document.hidden)pauseGame();}).catch(fail);document.body.appendChild(script);};
canvas.addEventListener('contextmenu',event=>event.preventDefault());canvas.addEventListener('wheel',event=>event.preventDefault(),{passive:false});canvas.addEventListener('pointerdown',()=>canvas.focus());
canvas.addEventListener('keydown',event=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code))event.preventDefault();});
window.addEventListener('blur',pauseGame);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)pauseGame();});
fullscreen.onclick=()=>{if(!document.fullscreenElement)stage.requestFullscreen().then(()=>canvas.focus()).catch(()=>{status.textContent='전체화면을 사용할 수 없습니다.';});else document.exitFullscreen();};
pause.onclick=()=>{pauseGame();canvas.focus();};
window.addEventListener('beforeunload',event=>{if(instance&&!quitting){event.preventDefault();event.returnValue='';}});
</script></body></html>
